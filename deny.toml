# cargo-deny policy.
#
# Bundling WinFsp relies on its FLOSS exception, which requires that
# ButterSat is not linked or distributed with proprietary software
# (design §11.1). Every dependency must therefore be under an OSI/FSF
# approved licence.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    # winfsp / winfsp-sys: GPLv3 with the WinFsp FLOSS exception.
    "GPL-3.0",
    "GPL-3.0-only",
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
ignore = []

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
