# cargo-deny policy.
#
# Bundling WinFsp relies on its FLOSS exception, which requires that
# ButterSat is not linked or distributed with proprietary software
# (design §11.1). Every dependency must therefore be under an OSI/FSF
# approved licence.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    # winfsp / winfsp-sys: GPLv3 with the WinFsp FLOSS exception.
    "GPL-3.0",
    "GPL-3.0-only",
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
# Unmaintained (not vulnerable) crates deep in third-party trees, with no
# maintained alternative available upstream. Re-check when they update.
ignore = [
    # paste: proc-macro used at build time by winfsp (WinFsp bindings).
    { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro of winfsp; no upgrade available" },
    # proc-macro-error: build-time, via gtk/glib macros (Tauri on Linux).
    { id = "RUSTSEC-2024-0370", reason = "build-time proc-macro of Tauri's Linux GTK stack" },
    # zbus_names / zvariant / zvariant_derive: D-Bus, via Tauri on Linux.
    { id = "RUSTSEC-2026-0370", reason = "Tauri Linux D-Bus dependency; no upgrade available" },
    { id = "RUSTSEC-2026-0371", reason = "Tauri Linux D-Bus dependency; no upgrade available" },
    { id = "RUSTSEC-2026-0372", reason = "Tauri Linux D-Bus dependency; no upgrade available" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
