[workspace]
resolver = "2"
members = [
    "crates/xof-core",
    "crates/xof-mesh",
    "crates/xof-proto",
    "crates/xof-vfs",
    "crates/xof-daemon",
    "crates/xof-cli",
    "crates/xof-publish",
    "crates/xof-bench",
    "crates/xof-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emergencybutter/ButterSat"
rust-version = "1.80"

[workspace.dependencies]
xof-core = { path = "crates/xof-core" }
xof-mesh = { path = "crates/xof-mesh" }
xof-proto = { path = "crates/xof-proto" }
xof-vfs = { path = "crates/xof-vfs" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
parking_lot = "0.12"
rayon = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
dirs = "5"
redb = "2"
lru = "0.19"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
intel_tex_2 = "0.4"
md-5 = "0.10"
sevenz-rust2 = { version = "0.25", default-features = false }
futures = "0.3"
hex = "0.4"
rand = "0.8"
interprocess = { version = "2", features = ["tokio"] }
tempfile = "3"
proptest = "1"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
