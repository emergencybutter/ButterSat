[package]
name = "xof-vfs"
description = "Virtual scenery filesystem for ButterSat (WinFsp on Windows, FUSE on Linux/macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xof-core.workspace = true
xof-mesh.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
parking_lot.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", default-features = false, features = ["delayload"] }
winfsp-sys = "0.12"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.15" }

[dev-dependencies]
tempfile.workspace = true
image.workspace = true
ed25519-dalek.workspace = true
zstd.workspace = true
rand.workspace = true
md-5.workspace = true
