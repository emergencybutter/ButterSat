# ButterSat landing page (buttersat.butr.cc), behind Cloudflare.
# Files: repo site/ -> /var/www/buttersat/site on the host, mounted
# read-only at /srv/buttersat/site in the nginx container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name buttersat.butr.cc;

    ssl_certificate     /etc/nginx/certs/butr.cc.pem;
    ssl_certificate_key /etc/nginx/certs/butr.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/buttersat/site;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /img/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }
}
