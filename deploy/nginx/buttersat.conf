# satsrv.butr.cc, behind Cloudflare: the app update feed and installers
# (/updates/). The mesh catalog moved to Cloudflare R2 (tiles.butr.cc);
# /v1/ redirects there for clients that still have this mirror configured.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name satsrv.butr.cc;

    ssl_certificate     /etc/nginx/certs/butr.cc.pem;
    ssl_certificate_key /etc/nginx/certs/butr.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/buttersat;
    autoindex off;

    types {
        application/json         json;
        application/octet-stream exe msi;
        application/zstd         zst;
        text/plain               sig;
        image/png                png;
    }

    location = / {
        default_type text/plain;
        return 200 "ButterSat mesh catalog: https://github.com/emergencybutter/ButterSat\n";
    }

    # Auto-updater feed (`tauri-plugin-updater`): short cache so new releases
    # are picked up promptly.
    location = /updates/latest.json {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Versioned installer and signature artifacts under /updates/.
    location /updates/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The mesh catalog lives on R2. 302 rather than 301 so the manifest
    # redirect is never cached as permanent alongside its old content.
    location /v1/ {
        add_header Cache-Control "public, max-age=3600" always;
        return 302 https://tiles.butr.cc$request_uri;
    }

    location / {
        return 404;
    }
}
