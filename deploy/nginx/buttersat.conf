# ButterSat mesh catalog origin (satsrv.butr.cc), behind Cloudflare.
# Static files only: /srv/buttersat/v1 holds the signed manifest and the
# content-addressed objects written by `xof-publish`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name satsrv.butr.cc;

    ssl_certificate     /etc/nginx/certs/butr.cc.pem;
    ssl_certificate_key /etc/nginx/certs/butr.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/buttersat;
    autoindex off;

    types {
        application/zstd zst;
        text/plain       sig;
        image/png        png;
    }

    location = / {
        default_type text/plain;
        return 200 "ButterSat mesh catalog: https://github.com/emergencybutter/ButterSat\n";
    }

    # The manifest changes on each release: short cache, ETag revalidation.
    location ~ ^/v1/manifest\.json\.zst(\.sig)?$ {
        add_header Cache-Control "public, max-age=300" always;
    }

    # Everything else is content-addressed (name contains its BLAKE3 hash).
    location /v1/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
