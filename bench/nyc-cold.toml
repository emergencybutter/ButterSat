# Cold start time: the flight loads at JFK with empty caches. A/B of fetch
# concurrency and departure pre-warming. (Esri's CDN has these NYC tiles
# cached by now, so absolute times are optimistic for a first-time user.)
name = "nyc-cold"
slew_speed_kt = 250
shots_s = [0, 5]
compare_to = "reference"
origin = "../../xporthofs-build/origin"
public_keys = ["7edb3db45bc7858959a6347242b3804b7f360012446389288f417323290ddf94"]

[[spot]]
name = "JFK (ZL17)"
lat = 40.6413
lon = -73.7781
alt_ft = 3000

[[spot]]
