# NYC pilot benchmark: seven spots inside +40-074 (the tile with an Ortho4XP
# reference build). Paths are relative to this file and assume the pilot
# build workspace sits next to the repo (../xporthofs-build).
name = "nyc"
slew_speed_kt = 250
shots_s = [0, 2, 5, 10, 20, 40]
fov_deg = 60
compare_to = "reference"
origin = "../../xporthofs-build/origin"
public_keys = ["7edb3db45bc7858959a6347242b3804b7f360012446389288f417323290ddf94"]
disable_packs = ["nyc"]

